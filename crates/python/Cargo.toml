[package]
name = "glaciers_python"
description = "Glaciers is a rust python bindings to decode raw EVM logs into decoded events."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "glaciers_python"
path = "rust_src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
glaciers = { workspace = true, features = ["python"]}
polars = { workspace = true }
alloy = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
openssl = { workspace = true }
pyo3 = { version = "0.27.0", features = ["extension-module"] }
pyo3-polars = "0.26.0"
pyo3-async-runtimes = { version = "0.27.0", features = ["tokio-runtime"] }
